<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分享本地产物 · Ryugi Hub</title>
  <link rel="stylesheet" href="./hub.css">
  <script src="./hub.js" defer></script>
</head>
<body>
  <main>
    <a id="home" href="/" hidden>← 返回产物 Hub</a>
    <h1>分享本地产物</h1>
    <form id="share">
      <label for="artifact">选择产物</label>
      <select id="artifact" required disabled>
        <option value="">请选择项目中的产物</option>
      </select>
      <dl id="details" hidden>
        <dt>项目</dt><dd id="project"></dd>
        <dt>发布到</dt><dd id="server"></dd>
      </dl>
      <p>拿到链接的人都可以查看这份只读快照。再次分享会更新同一个链接。</p>
      <button id="publish" type="submit" disabled>生成分享链接</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
      <label for="url">分享链接</label>
      <input id="url" type="url" readonly>
      <div class="actions">
        <button id="copy" type="button">复制链接</button>
        <a id="open" target="_blank" rel="noopener noreferrer">打开快照 ↗</a>
      </div>
    </section>
  </main>
</body>
</html>
